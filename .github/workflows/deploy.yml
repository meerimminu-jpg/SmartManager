name: Python application static analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Flake8 линтерин орнотуу
      run: pip install flake8

    - name: Коддун сапатын текшерүү (Статический анализ)
      run: |
        # Биринчи: оор каталарды текшерүү (Синтаксистик каталар)
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        
        # Экинчи: стилдик каталарды текшерүү (PEP 8)
        # --exit-zero болсо, стиль ката үчүн пайплайн токтобойт, бирок эскертүү берет
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
